name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: python -m ruff check --select E9,F63,F7,F82 src tests
      - run: python -m ruff format --check src tests
      - run: garmin-export --help
      - run: garmin-export --output "${{ runner.temp }}/archive with spaces" report
      - if: runner.os != 'Windows'
        run: ./run.sh --help
      - if: runner.os == 'Windows'
        run: ./run.ps1 --help
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          ./run.sh --output "${{ runner.temp }}/launcher archive" report
          if ./run.sh invalid-command; then exit 1; fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./run.ps1 --output "${{ runner.temp }}/launcher archive" report
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./run.ps1 invalid-command
          if ($LASTEXITCODE -eq 0) { exit 1 }
          exit 0
